name: Build Allan Hermes Agent Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.allan
      - docker/allan/**
      - .github/workflows/allan-hermes-agent-image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.allan
      - docker/allan/**
      - .github/workflows/allan-hermes-agent-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: allan-hermes-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/loopallan/allan-hermes-agent

jobs:
  publish:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allan
          platforms: linux/amd64
          load: true
          tags: allan-hermes-agent:test
          cache-from: type=gha,scope=allan-hermes-agent

      - name: Verify installed tools
        run: docker run --rm allan-hermes-agent:test jq --version

      - name: Publish verified image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allan
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('{0}:main', env.IMAGE_NAME) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=allan-hermes-agent
          cache-to: type=gha,mode=max,scope=allan-hermes-agent
