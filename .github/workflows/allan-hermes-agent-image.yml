name: Build Allan Hermes Agent Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.allan
      - docker/allan/**
      - .github/workflows/allan-hermes-agent-image.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.allan
      - docker/allan/**
      - .github/workflows/allan-hermes-agent-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: allan-hermes-agent-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/loopallan/allan-hermes-agent
  TEST_IMAGE: allan-hermes-agent:test

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This repository deliberately tracks maintained major action releases.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allan
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=allan-hermes-agent
          cache-to: type=gha,mode=max,scope=allan-hermes-agent
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify installed tools
        run: docker run --rm ${{ env.TEST_IMAGE }} jq --version

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$TEST_IMAGE" "$IMAGE_NAME:${GITHUB_SHA}"
          docker tag "$TEST_IMAGE" "$IMAGE_NAME:main"
          docker push "$IMAGE_NAME:${GITHUB_SHA}"
          docker push "$IMAGE_NAME:main"
