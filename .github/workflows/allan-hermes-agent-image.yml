name: Build Allan Hermes Agent Image

on:
  workflow_run:
    workflows: [Publish Fork Image to GHCR]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: allan-hermes-agent-${{ github.event.workflow_run.head_sha || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/loopallan/allan-hermes-agent
  TEST_IMAGE: allan-hermes-agent:test
  SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build-test-and-publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # This repository deliberately tracks maintained major action releases.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allan
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha,scope=allan-hermes-agent
          cache-to: type=gha,mode=max,scope=allan-hermes-agent
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
          build-args: BASE_IMAGE=ghcr.io/loopallan/my-hermes-agent:${{ env.SOURCE_SHA }}

      - name: Verify installed tools
        run: docker run --rm ${{ env.TEST_IMAGE }} jq --version

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'workflow_run'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        if: github.event_name == 'workflow_run'
        run: |
          set -euo pipefail
          docker tag "$TEST_IMAGE" "$IMAGE_NAME:${SOURCE_SHA}"
          docker tag "$TEST_IMAGE" "$IMAGE_NAME:main"
          docker push "$IMAGE_NAME:${SOURCE_SHA}"
          docker push "$IMAGE_NAME:main"

  promote-gitops:
    if: github.event_name == 'workflow_run'
    needs: build-test-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ALLAN_APPS_GITOPS_TOKEN
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published image
        run: docker pull "$IMAGE_NAME:${SOURCE_SHA}"

      - name: Promote immutable image digest to Allan GitOps
        env:
          ALLAN_APPS_GITOPS_TOKEN: ${{ secrets.ALLAN_APPS_GITOPS_TOKEN }}
          GITOPS_REPOSITORY: LoopAllan/allan-apps
          GITOPS_PROFILE: hermes-agent/overlays/prod/profiles/allan-hermes-dev.yaml
        run: |
          set -euo pipefail
          test -n "$ALLAN_APPS_GITOPS_TOKEN" || {
            echo "ALLAN_APPS_GITOPS_TOKEN is required to promote Allan Hermes GitOps" >&2
            exit 1
          }

          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$IMAGE_NAME:${SOURCE_SHA}")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "invalid published image digest: $digest" >&2
            exit 1
          }

          askpass="$(mktemp)"
          trap 'rm -f "$askpass"' EXIT
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s' x-access-token ;;
            *) printf '%s' "$ALLAN_APPS_GITOPS_TOKEN" ;;
          esac
          EOF
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git clone --depth=1 --branch main --single-branch \
              "https://github.com/${GITOPS_REPOSITORY}.git" allan-apps
          cd allan-apps
          test -f "$GITOPS_PROFILE" || {
            echo "required GitOps profile is missing: $GITOPS_PROFILE" >&2
            exit 1
          }

          docker run --rm --entrypoint python3 --user "$(id -u):$(id -g)" \
            -v "$PWD:/gitops" \
            -v "$GITHUB_WORKSPACE/.github/scripts/promote_allan_hermes_gitops.py:/tmp/promote_allan_hermes_gitops.py:ro" \
            "$IMAGE_NAME:${SOURCE_SHA}" \
              /tmp/promote_allan_hermes_gitops.py \
              --profile "/gitops/$GITOPS_PROFILE" \
              --digest "$digest"
          if git diff --quiet -- "$GITOPS_PROFILE"; then
            echo "GitOps profile already pins $digest"
            exit 0
          fi

          git config user.name "allan-hermes-agent[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$GITOPS_PROFILE"
          git diff --cached --check
          git commit -m "chore(hermes): promote allan image ${SOURCE_SHA}"
          git push origin HEAD:main
